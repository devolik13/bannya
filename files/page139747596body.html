(function () {
  const block = document.querySelector('#rec2241119501');
  if (!block) return;

  function init() {
    const buttons = block.querySelectorAll('.button-nominal');
    const slides = block.querySelectorAll('.t-slds__item');
    const output = block.querySelector('.text-nominal .tn-atom');
    const continueBtn = block.querySelector('[data-elem-id="1777905021170"] a');

    if (!buttons.length || !slides.length || !output || !continueBtn) {
      return false;
    }

    const valueMap = {
      1: 30000,
      2: 50000,
      3: 100000
    };

    const nominalMap = {
      30: 1,
      50: 2,
      100: 3
    };

    function formatPrice(value) {
      return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '₽';
    }

    function setActiveButton(index) {
      buttons.forEach(btn => {
        const nominal = btn.getAttribute('data-nominal');
        btn.classList.toggle('uc-active', nominalMap[nominal] === index);
      });
    }

    function setNominalText(index) {
      const value = valueMap[index];
      if (!value) return;
      output.textContent = formatPrice(value);
    }

    function getActiveSlideLink() {
      const active = block.querySelector('.t-slds__item_active');
      if (!active) return '#';

      const link = active.querySelector('a[href]');
      if (!link) return '#';

      return link.getAttribute('href');
    }

    function setButtonLink() {
      const href = getActiveSlideLink();
      continueBtn.setAttribute('href', href);
    }

    function goToSlide(index) {
      const dots = block.querySelectorAll('.t-slds__bullet');
      if (!dots.length) return;

      const target = dots[index - 1];
      if (!target) return;

      target.click();
    }

    // клики по кнопкам
    buttons.forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.preventDefault();

        const nominal = this.getAttribute('data-nominal');
        const index = nominalMap[nominal];
        if (!index) return;

        const active = block.querySelector('.t-slds__item_active');
        const activeIndex = active
          ? parseInt(active.getAttribute('data-slide-index'), 10)
          : null;

        if (activeIndex === index) return;

        goToSlide(index);
      });
    });

    // наблюдение за слайдером
    const observer = new MutationObserver(() => {
      const active = block.querySelector('.t-slds__item_active');
      if (!active) return;

      const index = parseInt(active.getAttribute('data-slide-index'), 10);

      setActiveButton(index);
      setNominalText(index);
      setButtonLink();
    });

    slides.forEach(slide => {
      observer.observe(slide, {
        attributes: true,
        attributeFilter: ['class']
      });
    });

    // стартовое состояние
    const active = block.querySelector('.t-slds__item_active');
    if (active) {
      const index = parseInt(active.getAttribute('data-slide-index'), 10);

      setActiveButton(index);
      setNominalText(index);
      setButtonLink();
    }

    return true;
  }

  // ожидание Tilda
  let i = 0;
  const interval = setInterval(() => {
    i++;

    if (init()) clearInterval(interval);
    if (i > 20) clearInterval(interval);
  }, 300);
})();
